# Police
font_family      FantasqueSansM Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0

# Shell (en attendant que chsh prenne effet)
shell /usr/bin/fish

# Touche leader : ctrl+a, tu lâches, puis la lettre.
# Les raccourcis ctrl+shift par défaut marchent toujours à côté.

# ctrl+a deux fois envoie un vrai ctrl+a (début de ligne dans fish, +1 dans nvim)
map ctrl+a>ctrl+a send_key ctrl+a

# Onglets
map ctrl+a>c new_tab_with_cwd
map ctrl+a>n next_tab
map ctrl+a>p previous_tab
map ctrl+a>, set_tab_title
map ctrl+a>& close_tab
map ctrl+a>1 goto_tab 1
map ctrl+a>2 goto_tab 2
map ctrl+a>3 goto_tab 3
map ctrl+a>4 goto_tab 4
map ctrl+a>5 goto_tab 5
map ctrl+a>6 goto_tab 6
map ctrl+a>7 goto_tab 7
map ctrl+a>8 goto_tab 8
map ctrl+a>9 goto_tab 9

# Panneaux
# v et s comme :vsplit et :split dans nvim
map ctrl+a>v launch --location=vsplit --cwd=current
map ctrl+a>s launch --location=hsplit --cwd=current
map ctrl+a>h neighboring_window left
map ctrl+a>j neighboring_window down
map ctrl+a>k neighboring_window up
map ctrl+a>l neighboring_window right
map ctrl+a>x close_window
map ctrl+a>z toggle_layout stack
map ctrl+a>r start_resizing_window


# Multiplexed windows
window_margin_width 10
background_tint 0.97
background_tint_gaps 0
window_border_width 1pt
# active_border_color #44ffff
single_window_margin_width 0
# splits en premier : ctrl+a > v / s en ont besoin. ctrl+shift+l pour passer en tall
enabled_layouts splits, tall, stack
tab_bar_style powerline
tab_powerline_style slanted

# Aide : la fiche des raccourcis par-dessus le terminal, q pour fermer
map ctrl+a>shift+/ launch --type=overlay bat --paging=always --style=plain --theme=ansi /home/yaichi/asahi_config/docs/raccourcis-kitty.md
map ctrl+a>? launch --type=overlay bat --paging=always --style=plain --theme=ansi /home/yaichi/asahi_config/docs/raccourcis-kitty.md

# Config
map ctrl+a>e edit_config_file
map ctrl+a>shift+r load_config_file


# BEGIN_KITTY_THEME
# Blazer
include current-theme.conf
# END_KITTY_THEME